name: Update and Build sapling-scm-bin

on:
  schedule:
    - cron: '20 3 * * *'
  workflow_dispatch:

jobs:
  check-and-build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    container:
      image: archlinux:base-devel
    outputs:
      changed: ${{ steps.versions.outputs.changed }}
      latest: ${{ steps.versions.outputs.latest }}

    steps:
      - name: Install dependencies and create builder user
        run: |
          pacman -Syu --noconfirm
          pacman -S --noconfirm git openssh jq curl pacman-contrib sudo nodejs
          useradd -m builder
          echo "builder ALL=(ALL) NOPASSWD: ALL" >> /etc/sudoers

      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set ownership for builder user
        run: chown -R builder:builder "$GITHUB_WORKSPACE"

      - name: Configure Git for builder user
        run: |
          sudo -u builder -E HOME=/home/builder git config --global user.name "github-actions[bot]"
          sudo -u builder -E HOME=/home/builder git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Get current and latest versions
        id: versions
        run: |
          current_ver=$(grep -oP '^pkgver=\K.*' sapling-scm-bin/PKGBUILD)
          latest_ver=$(curl -fsSL https://api.github.com/repos/facebook/sapling/releases/latest | jq -er '.tag_name' | sed 's/-/./g')
          changed=false
          if [ "$current_ver" != "$latest_ver" ] || [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            changed=true
          fi
          echo "current=$current_ver" >> "$GITHUB_OUTPUT"
          echo "latest=$latest_ver" >> "$GITHUB_OUTPUT"
          echo "changed=$changed" >> "$GITHUB_OUTPUT"
          echo "Current version: $current_ver"
          echo "Latest version: $latest_ver"

      - name: Update PKGBUILD and checksums
        if: steps.versions.outputs.changed == 'true'
        run: |
          latest_ver="${{ steps.versions.outputs.latest }}"
          if [ "${{ steps.versions.outputs.current }}" != "$latest_ver" ]; then
            sed -i "s/^pkgver=.*/pkgver=$latest_ver/" sapling-scm-bin/PKGBUILD
            sed -i "s/^pkgrel=.*/pkgrel=1/" sapling-scm-bin/PKGBUILD
          fi
          sudo -u builder -E HOME=/home/builder bash -lc 'cd sapling-scm-bin && updpkgsums && makepkg --printsrcinfo > .SRCINFO'

      - name: Build package
        if: steps.versions.outputs.changed == 'true'
        run: sudo -u builder -E HOME=/home/builder bash -lc 'cd sapling-scm-bin && makepkg -fs --noconfirm'

      - name: Push updated packaging to GitHub
        if: steps.versions.outputs.changed == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          sudo -u builder -E HOME=/home/builder git remote set-url origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          sudo -u builder -E HOME=/home/builder git add sapling-scm-bin/PKGBUILD sapling-scm-bin/.SRCINFO
          sudo -u builder -E HOME=/home/builder git commit -m "update: ${{ steps.versions.outputs.latest }}" || true
          sudo -u builder -E HOME=/home/builder git push origin main

      - name: Summary
        run: |
          if [ "${{ steps.versions.outputs.changed }}" = "true" ]; then
            echo "Built and pushed version ${{ steps.versions.outputs.latest }} to GitHub."
          else
            echo "No new version available. Current: ${{ steps.versions.outputs.current }}"
          fi

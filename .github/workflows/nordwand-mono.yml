name: Update and Publish nordwand-mono to AUR

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

concurrency:
  group: nordwand-mono
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  check-and-build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    container:
      image: archlinux:base-devel
    outputs:
      changed: ${{ steps.versions.outputs.changed }}
      latest: ${{ steps.versions.outputs.latest }}

    steps:
      - name: Install dependencies and create builder user
        run: |
          pacman -Syu --noconfirm
          pacman -S --noconfirm git openssh jq curl pacman-contrib sudo
          useradd -m builder

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set ownership for builder user
        run: chown -R builder:builder "$GITHUB_WORKSPACE"

      - name: Configure Git for builder user
        run: |
          sudo -u builder -H git config --global user.name "github-actions[bot]"
          sudo -u builder -H git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Get current and latest versions
        id: versions
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          current_ver=$(sed -n 's/^pkgver=//p' nordwand-mono/PKGBUILD)
          latest_ver=$(curl -fsSL --retry 3 \
            -H "Authorization: Bearer $GITHUB_TOKEN" \
            https://api.github.com/repos/tywr/Nordwand-Mono/releases/latest \
            | jq -er '.tag_name | select(test("^[0-9]+([.][0-9]+)*$"))')
          changed=false
          if [ "$current_ver" != "$latest_ver" ] || [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            changed=true
          fi
          echo "current=$current_ver" >> "$GITHUB_OUTPUT"
          echo "latest=$latest_ver" >> "$GITHUB_OUTPUT"
          echo "changed=$changed" >> "$GITHUB_OUTPUT"
          echo "Current version: $current_ver"
          echo "Latest version: $latest_ver"

      - name: Update PKGBUILD and checksums
        if: steps.versions.outputs.changed == 'true'
        env:
          LATEST_VERSION: ${{ steps.versions.outputs.latest }}
        run: |
          sed -i "s/^pkgver=.*/pkgver=$LATEST_VERSION/" nordwand-mono/PKGBUILD
          sed -i 's/^pkgrel=.*/pkgrel=1/' nordwand-mono/PKGBUILD
          sudo -u builder -H bash -c 'cd nordwand-mono && updpkgsums && makepkg --printsrcinfo > .SRCINFO'

      - name: Build both font packages
        if: steps.versions.outputs.changed == 'true'
        run: sudo -u builder -H bash -c 'cd nordwand-mono && makepkg -f'

      - name: Push updated packaging to GitHub
        if: steps.versions.outputs.changed == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          LATEST_VERSION: ${{ steps.versions.outputs.latest }}
        run: |
          sudo -u builder -H git remote set-url origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          sudo -u builder -H git add nordwand-mono/PKGBUILD nordwand-mono/.SRCINFO
          if ! sudo -u builder -H git diff --cached --quiet; then
            sudo -u builder -H git commit -m "update: nordwand-mono $LATEST_VERSION"
            sudo -u builder -H git push origin HEAD:main
          fi

      - name: Summary
        env:
          CHANGED: ${{ steps.versions.outputs.changed }}
          CURRENT_VERSION: ${{ steps.versions.outputs.current }}
          LATEST_VERSION: ${{ steps.versions.outputs.latest }}
        run: |
          if [ "$CHANGED" = "true" ]; then
            echo "Built and pushed version $LATEST_VERSION to GitHub."
          else
            echo "No new version available. Current: $CURRENT_VERSION"
          fi

  aur-publish:
    needs: check-and-build
    if: needs.check-and-build.outputs.changed == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Publish split font package to AUR
        uses: KSXGitHub/github-actions-deploy-aur@v4.1.3
        with:
          pkgname: nordwand-mono
          pkgbuild: ./nordwand-mono/PKGBUILD
          assets: |
            nordwand-mono/.SRCINFO
          commit_username: ${{ secrets.AUR_USERNAME }}
          commit_email: ${{ secrets.AUR_EMAIL }}
          ssh_private_key: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
          commit_message: "aur: ${{ needs.check-and-build.outputs.latest }}"
          ssh_keyscan_types: rsa,ecdsa,ed25519

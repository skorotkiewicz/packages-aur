name: Update and Publish prospero-bin to AUR

on:
  schedule:
    - cron: '0 4 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check-and-build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    container:
      image: archlinux:base-devel
    outputs:
      changed: ${{ steps.versions.outputs.changed }}
      latest: ${{ steps.versions.outputs.latest }}

    steps:
      - name: Install dependencies and create builder user
        run: |
          pacman -Syu --noconfirm
          pacman -S --noconfirm git sudo curl jq pacman-contrib
          useradd -m builder
          echo "builder ALL=(ALL) NOPASSWD: ALL" >> /etc/sudoers

      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: main
          persist-credentials: false

      - name: Set ownership for builder user
        run: chown -R builder:builder "$GITHUB_WORKSPACE"

      - name: Configure Git for builder user
        run: |
          sudo -u builder -E HOME=/home/builder git config --global user.name "github-actions[bot]"
          sudo -u builder -E HOME=/home/builder git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Get current and latest versions
        id: versions
        run: |
          current_ver=$(grep -oP '^pkgver=\K.*' prospero-bin/PKGBUILD)
          latest_ver=$(curl -fsSL https://api.github.com/repos/skeeto/prospero/releases/latest | jq -er '.tag_name | ltrimstr("v")')
          if ! printf '%s\n' "$latest_ver" | grep -Eq '^[0-9]+(\.[0-9]+)*$'; then
            echo "Invalid release version: $latest_ver" >&2
            exit 1
          fi
          changed=false
          if [ "$current_ver" != "$latest_ver" ] || [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            changed=true
          fi
          echo "current=$current_ver" >> "$GITHUB_OUTPUT"
          echo "latest=$latest_ver" >> "$GITHUB_OUTPUT"
          echo "changed=$changed" >> "$GITHUB_OUTPUT"
          echo "Current version: $current_ver"
          echo "Latest version: $latest_ver"

      - name: Update PKGBUILD and checksums
        if: steps.versions.outputs.changed == 'true'
        run: |
          latest_ver="${{ steps.versions.outputs.latest }}"
          if [ "${{ steps.versions.outputs.current }}" != "$latest_ver" ]; then
            sed -i "s/^pkgver=.*/pkgver=$latest_ver/; s/^pkgrel=.*/pkgrel=1/" prospero-bin/PKGBUILD
          fi
          sudo -u builder -E HOME=/home/builder bash -lc 'cd prospero-bin && updpkgsums && makepkg --printsrcinfo > .SRCINFO'

      - name: Build package
        if: steps.versions.outputs.changed == 'true'
        run: sudo -u builder -E HOME=/home/builder bash -lc 'cd prospero-bin && makepkg -fs --noconfirm'

      - name: Push updated packaging to GitHub
        if: steps.versions.outputs.changed == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          sudo -u builder -E HOME=/home/builder bash -ec '
            git remote set-url origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
            git add prospero-bin/PKGBUILD prospero-bin/.SRCINFO
            if ! git diff --cached --quiet; then
              git commit -m "update: ${{ steps.versions.outputs.latest }}"
            fi
            git push origin main
          '

  aur-publish:
    needs: check-and-build
    if: needs.check-and-build.outputs.changed == 'true'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          persist-credentials: false

      - name: Publish AUR package
        uses: KSXGitHub/github-actions-deploy-aur@v4.1.3
        with:
          pkgname: prospero-bin
          pkgbuild: ./prospero-bin/PKGBUILD
          test: 'false'
          assets: |
            prospero-bin/.SRCINFO
          commit_username: ${{ secrets.AUR_USERNAME }}
          commit_email: ${{ secrets.AUR_EMAIL }}
          ssh_private_key: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
          commit_message: "aur: ${{ needs.check-and-build.outputs.latest }}"
          ssh_keyscan_types: rsa,ecdsa,ed25519

name: Update and Publish lemon-studio-git to AUR

on:
  schedule:
    - cron: '20 4 * * *'
  workflow_dispatch:

jobs:
  check-and-build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    container:
      image: archlinux:base-devel
    outputs:
      changed: ${{ steps.versions.outputs.changed }}
      latest: ${{ steps.versions.outputs.latest }}

    steps:
      - name: Install dependencies and create builder user
        run: |
          pacman -Syu --noconfirm
          pacman -S --noconfirm git sudo
          useradd -m builder
          echo "builder ALL=(ALL) NOPASSWD: ALL" >> /etc/sudoers

      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set ownership for builder user
        run: chown -R builder:builder "$GITHUB_WORKSPACE"

      - name: Configure Git for builder user
        run: |
          sudo -u builder -E HOME=/home/builder git config --global user.name "github-actions[bot]"
          sudo -u builder -E HOME=/home/builder git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Get current and latest Git versions
        id: versions
        run: |
          current_ver=$(grep -oP '^pkgver=\K.*' lemon-studio-git/PKGBUILD)
          sudo -u builder -E HOME=/home/builder bash -lc 'cd lemon-studio-git && makepkg --nobuild --nodeps --noprepare'
          latest_ver=$(grep -oP '^pkgver=\K.*' lemon-studio-git/PKGBUILD)
          changed=false
          if [ "$current_ver" != "$latest_ver" ] || [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            changed=true
          fi
          echo "current=$current_ver" >> "$GITHUB_OUTPUT"
          echo "latest=$latest_ver" >> "$GITHUB_OUTPUT"
          echo "changed=$changed" >> "$GITHUB_OUTPUT"
          echo "Current version: $current_ver"
          echo "Latest version: $latest_ver"

      - name: Generate package metadata
        if: steps.versions.outputs.changed == 'true'
        run: sudo -u builder -E HOME=/home/builder bash -lc 'cd lemon-studio-git && makepkg --printsrcinfo > .SRCINFO'

      - name: Build package
        if: steps.versions.outputs.changed == 'true'
        # Build the revision used for metadata, not a newer upstream commit.
        run: sudo -u builder -E HOME=/home/builder bash -lc 'cd lemon-studio-git && makepkg -fs --holdver --noconfirm'

      - name: Push updated packaging to GitHub
        if: steps.versions.outputs.changed == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          sudo -u builder -E HOME=/home/builder git remote set-url origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          sudo -u builder -E HOME=/home/builder git add lemon-studio-git/PKGBUILD lemon-studio-git/.SRCINFO
          sudo -u builder -E HOME=/home/builder git commit -m "update: ${{ steps.versions.outputs.latest }}" || true
          sudo -u builder -E HOME=/home/builder git push origin main

      - name: Summary
        run: |
          if [ "${{ steps.versions.outputs.changed }}" = "true" ]; then
            echo "Built and pushed version ${{ steps.versions.outputs.latest }} to GitHub."
          else
            echo "No new version available. Current: ${{ steps.versions.outputs.current }}"
          fi

  aur-publish:
    needs: check-and-build
    if: needs.check-and-build.outputs.changed == 'true'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          persist-credentials: false

      - name: Publish AUR package
        uses: KSXGitHub/github-actions-deploy-aur@v4.1.3
        with:
          pkgname: lemon-studio-git
          pkgbuild: ./lemon-studio-git/PKGBUILD
          assets: |
            lemon-studio-git/.SRCINFO
          commit_username: ${{ secrets.AUR_USERNAME }}
          commit_email: ${{ secrets.AUR_EMAIL }}
          ssh_private_key: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
          commit_message: "aur: ${{ needs.check-and-build.outputs.latest }}"
          ssh_keyscan_types: rsa,ecdsa,ed25519
